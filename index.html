<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chirograph Verify</title>
    <meta name="description" content="Device intelligence and verification by Chirograph Verify." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Clerk is loaded from the tenant's own Clerk domain, and the console is
         render-blocked on it: this is the single largest item in the cold-start
         auth transition. Opening DNS+TLS to it in parallel with our own bundle
         removes that setup from the critical path. -->
    <link rel="preconnect" href="https://clerk.chirographverify.com" crossorigin />
    <link rel="dns-prefetch" href="https://clerk.chirographverify.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <meta property="og:image" content="https://bolt.new/static/og_default.png">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="https://bolt.new/static/og_default.png">
    <script>
      /*
       * Apply the persisted theme before first paint. The React effect in
       * DashboardLayout only runs after hydration, so without this a light-mode
       * user briefly sees the true-black canvas — a visible flash. This must
       * stay inline and synchronous; an external module would be too late.
       */
      try {
        if (localStorage.getItem('cv-theme') === 'light') {
          document.documentElement.classList.add('light');
        }
      } catch (e) {
        /* private mode — fall back to the dark-first default */
      }
    </script>
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
